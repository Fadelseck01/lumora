<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080f1c">
  <meta name="description" content="LUMORA — Explore le monde, comprends l'univers.">
  <title>LUMORA — Explore beyond</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <div class="ambient-layer" aria-hidden="true"><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div></div>
  <header class="topbar">
    <a class="brand" href="#/" data-i18n-aria="homeLabel" aria-label="LUMORA accueil"><span class="brand-mark">✧</span><span>LUMORA</span></a>
    <nav class="desktop-nav" data-i18n-aria="mainNav" aria-label="Navigation principale">
      <a href="#explore" data-i18n="navExplore">Explorer</a>
      <a href="#/atlas" data-i18n="navAtlas">Carte</a>
      <a href="#discoveries" data-i18n="navDiscoveries">Découvertes</a>
      <a href="#/chronologie" data-i18n="navTimeline">Chronologie</a>
      <a href="#/quiz" data-i18n="navQuiz">Quiz</a>
      <a href="#news" data-i18n="navNews">Actualités</a>
    </nav>
    <div class="top-actions">
      <button class="surprise-button" data-surprise><span aria-hidden="true">✦</span> <span class="surprise-text" data-i18n="surprise"></span></button>
      <a class="library-link" href="#/bibliotheque" data-i18n-aria="navLibrary" aria-label="Ma bibliothèque"><span aria-hidden="true">♡</span><span class="library-count" id="libraryCount" hidden></span></a>
      <span class="settings-wrap"><button class="icon-button settings-button" id="settingsBtn" data-i18n-aria="settings" aria-label="Paramètres" aria-expanded="false">⚙</button><div class="settings-pop" id="settingsPop" hidden></div></span>
      <button class="icon-button" id="searchFocus" data-i18n-aria="searchLabel" aria-label="Rechercher">⌕</button>
      <button class="language-button" id="languageToggle" data-i18n-aria="langLabel" aria-label="Switch to English">EN</button>
      <button class="menu-button" id="menuToggle" data-i18n-aria="menuLabel" aria-label="Ouvrir le menu">☰</button>
    </div>
  </header>

  <main id="home">
    <section class="hero">
      <canvas id="earthCanvas" class="earth-canvas" aria-hidden="true"></canvas>
      <div class="hero-shade" aria-hidden="true"></div>
      <div class="earth-controls">
        <span class="earth-hint"><span aria-hidden="true">⟲</span> <span data-i18n="dragHint"></span></span>
        <a class="earth-toggle atlas-cta" href="#/atlas">◍ <span data-i18n="atlasHero"></span></a>
        <button class="earth-toggle" id="earthToggle"><span class="when-horizon" data-i18n="viewWhole"></span><span class="when-whole" data-i18n="viewHorizon"></span></button>
      </div>
      <div class="hero-copy">
        <div class="eyebrow"><span class="pulse"></span><span data-i18n="eyebrow"></span></div>
        <h1 data-i18n="heroTitle"></h1>
        <p class="hero-description" data-i18n="heroDescription"></p>
        <form class="search-box" id="searchForm" role="search">
          <span class="search-symbol" aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchLabel" autocomplete="off">
          <button type="submit"><span data-i18n="searchButton"></span> <span>↗</span></button>
        </form>
        <div class="trending" id="trending"></div>
        <button class="surprise-hero" data-surprise><span aria-hidden="true">✦</span> <span data-i18n="surprise"></span></button>
      </div>
      <div class="hero-visual" aria-hidden="true">
        <div class="orbit orbit-a"></div><div class="orbit orbit-b"></div>
        <div class="planet-glow"></div>
        <div class="planet"></div>
        <div class="hero-star star-a">✦</div><div class="hero-star star-b">·</div><div class="hero-star star-c">✧</div>
        <div class="visual-label"><span class="visual-dot"></span><span data-i18n="visualLabel"></span></div>
        <div class="visual-coordinate">0° 00' 00" · ∞</div>
      </div>
      <div class="hero-bottom"><span data-i18n="scroll"></span><span class="scroll-line"></span><span id="heroCount"></span></div>
    </section>

    <section class="section universe-section" id="explore">
      <div class="section-heading">
        <div><div class="eyebrow" data-i18n="universesEyebrow"></div><h2><span data-i18n="universesTitle"></span><span class="accent">.</span></h2></div>
        <p data-i18n="universesIntro"></p>
      </div>
      <div class="universe-grid" id="universeGrid"></div>
    </section>

    <section class="section daily-section" id="daily"></section>

    <section class="section discoveries-section" id="discoveries">
      <div class="section-heading discoveries-heading">
        <div><div class="eyebrow" data-i18n="discoveriesEyebrow"></div><h2><span data-i18n="discoveriesTitle"></span><span class="accent">.</span></h2></div>
        <button class="text-link" id="showAll" data-i18n="showAll"></button>
      </div>
      <div class="filter-row" id="filterRow"></div>
      <div class="discovery-grid" id="discoveryGrid"></div>
      <div class="more-row" id="moreRow" hidden><button class="outline-button" id="showMore"></button></div>
      <div class="empty-state" id="emptyState" hidden><span>⌕</span><h3 data-i18n="emptyTitle"></h3><p data-i18n="emptyDescription"></p></div>
    </section>

    <section class="feature-band" id="featured">
      <div class="feature-image" aria-hidden="true">
        <div class="feature-image-glow"></div>
        <div class="feature-planet"></div>
        <span class="feature-image-caption" data-i18n="fieldNotes"></span>
      </div>
      <div class="feature-copy">
        <div class="eyebrow" data-i18n="journalEyebrow"></div>
        <div class="feature-tag" data-i18n="featuredTag"></div>
        <h2 data-i18n="featuredTitle"></h2>
        <p data-i18n="featuredDescription"></p>
        <button class="outline-button" data-open="life"><span data-i18n="readFeature"></span> <span>↗</span></button>
        <div class="feature-meta"><span data-i18n="readingTime"></span><span>•</span><span data-i18n="editorial"></span></div>
      </div>
    </section>

    <section class="section news-section" id="news">
      <div class="section-heading">
        <div><div class="eyebrow" data-i18n="newsEyebrow"></div><h2><span data-i18n="newsTitle"></span><span class="accent">.</span></h2></div>
        <p data-i18n="newsIntro"></p>
      </div>
      <div class="filter-row news-filters" id="newsFilters"></div>
      <div class="news-grid live" id="newsGrid"></div>
      <div class="more-row" id="newsMoreRow" hidden><button class="outline-button" id="newsMore"></button></div>
      <p class="news-note"><span>ⓘ</span><span id="newsStatus"></span></p>
    </section>

    <section class="section quote-section">
      <div class="quote-mark">“</div>
      <blockquote data-i18n="quote"></blockquote>
      <div class="quote-credit" data-i18n="quoteCredit"></div>
    </section>
  </main>
  <main id="page" class="page" hidden></main>

  <footer class="footer">
    <a class="brand" href="#"><span class="brand-mark">✧</span><span>LUMORA</span></a>
    <p data-i18n="footerLine"></p>
    <p class="footer-philosophy" data-i18n="philosophy"></p>
    <details class="credits"><summary data-i18n="creditsTitle"></summary><ul id="creditsList"></ul></details>
    <div class="footer-bottom"><span data-i18n="footerCopy"></span><span data-i18n="footerNote"></span></div>
  </footer>

  <div class="lightbox" id="lightbox" hidden><button class="lightbox-close" aria-label="×">×</button><button class="lightbox-nav prev" aria-label="←">‹</button><img alt=""><button class="lightbox-nav next" aria-label="→">›</button></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="vendor/three.min.js"></script>
  <script src="assets/earth-textures.js"></script>
  <script src="data/news.js"></script>
  <script src="data/videos-status.js"></script>
  <script src="extras.js"></script>

  <script src="articles-plus-mythes2.js"></script>
  <script src="articles-plus-mythes3.js"></script>
  <script src="articles-plus-histoire.js"></script>
  <script src="articles-plus-histoire2.js"></script>
  <script src="articles-plus-terre1.js"></script>
  <script src="articles-plus-terre2.js"></script>
  <script src="articles-plus-terre3.js"></script>
  <script src="articles-plus-terre4.js"></script>
  <script src="articles-plus-terre5.js"></script>
  <script src="articles-plus-terre6.js"></script>
  <script src="articles-plus-terre7.js"></script>
  <script src="articles-plus-terre8.js"></script>
  <script src="articles-plus-terre9.js"></script>
  <script src="articles-plus-peuples1.js"></script>

  <script src="articles-plus-corps2.js"></script>

  <script src="articles-plus-corps4.js"></script>

  <script src="articles-plus-boul3.js"></script>
  <script src="articles-plus-mysteres1.js"></script>

  <script src="articles-plus-mysteres3.js"></script>
  <script src="articles-plus-arts1.js"></script>
  <script src="articles-plus-vivant.js"></script>

  <script src="articles-plus-vivant4.js"></script>

  <script src="app.js"></script>
  <script src="atlas.js"></script>
  <script src="pages.js"></script>
  <script src="earth3d.js"></script>
</body>
</html>
