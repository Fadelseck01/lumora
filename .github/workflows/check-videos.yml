# LUMORA — vérification des vidéos YouTube
# - le 1er de chaque mois : vérifie toutes les vidéos des articles ; celles qui ont disparu
#   sont masquées automatiquement sur le site, et une « issue » GitHub te prévient (tu reçois un courriel)
# - lancement manuel avec des IDs : affiche la chaîne et le titre (pour choisir une nouvelle vidéo)
# - lancement manuel sans ID : fait la vérification complète tout de suite
name: Vérifier les vidéos YouTube

on:
  schedule:
    - cron: "23 9 1 * *"
  workflow_dispatch:
    inputs:
      ids:
        description: "IDs YouTube séparés par des espaces (laisser vide pour tout vérifier)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests

      - name: Vérifier des IDs précis
        if: inputs.ids != ''
        run: python scripts/check_videos.py ${{ inputs.ids }}

      - name: Vérifier toutes les vidéos du site
        id: site
        if: inputs.ids == ''
        run: python scripts/check_videos.py --site

      - name: Enregistrer et republier
        if: inputs.ids == '' && steps.site.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "lumora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos-status.json data/videos-status.js
          git commit -m "Vérification mensuelle des vidéos YouTube" || exit 0
          git pull --rebase --autostash || true
          git push
          gh workflow run lumora-news.yml --ref main

      - name: Prévenir (issue GitHub)
        if: inputs.ids == '' && steps.site.outputs.newly_dead != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.site.outputs.report }}
        run: |
          gh issue create --title "Vidéo(s) YouTube indisponible(s) sur LUMORA" --body "$(printf 'La vérification mensuelle a trouvé des vidéos qui ne sont plus disponibles. Elles sont déjà masquées sur le site.\n\n%s\n\nIl suffit de demander à Claude de les remplacer ou de les retirer.' "$REPORT")"
