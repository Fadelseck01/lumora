name: Vérifier des vidéos YouTube
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "IDs YouTube séparés par des espaces"
        required: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/check_videos.py ${{ inputs.ids }}
